<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your STEPZONE password</title></head>
<body style="margin:0;background:#f5f4f0;color:#101010;font-family:Arial,sans-serif;padding:32px;">
    <main style="max-width:560px;margin:0 auto;background:#fff;padding:36px;">
        <p style="font-size:11px;font-weight:700;letter-spacing:.16em;">STEPZONE</p>
        <h1 style="font-size:30px;">Hi {{ user.first_name }}, reset your password</h1>
        <p>We received a request to reset the password for your STEPZONE account. This link expires in one hour.</p>
        <p><a href="{{ reset_url }}" style="display:inline-block;background:#ff5a1f;color:#fff;padding:14px 20px;text-decoration:none;font-weight:700;">Choose a new password</a></p>
        <p>If you didn’t request this change, you can ignore this email.</p>
    </main>
</body>
</html>
