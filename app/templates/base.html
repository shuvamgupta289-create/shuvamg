<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="STEPZONE premium sneakers. Step Into Your Style.">
    <title>{% block title %}STEPZONE | Step Into Your Style{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% if not request.path.startswith('/admin') %}
    <div class="customer-utility-nav"><div class="customer-utility-inner"><span>STEPZONE</span><div>{% if session.get('customer_user_id') %}<a href="{{ url_for('customer_auth.account') }}">My account</a><form method="post" action="{{ url_for('customer_auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ session.get('customer_csrf_token', '') }}"><button type="submit">Log out</button></form>{% else %}<a href="{{ url_for('customer_auth.login') }}">Log in</a><a href="{{ url_for('customer_auth.register') }}">Register</a>{% endif %}</div></div></div>
    {% endif %}
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
