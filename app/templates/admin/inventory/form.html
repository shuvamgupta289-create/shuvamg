{% extends "base.html" %}

{% block title %}{{ "Edit" if variant else "Add" }} Variant | STEPZONE Admin{% endblock %}

{% block content %}
<main class="admin-dashboard-page">
    <div class="container content-shell admin-form-shell">
        <a class="detail-breadcrumb" href="{{ url_for('admin_inventory.listing') }}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to inventory</a>
        <p class="eyebrow">STEPZONE / ADMIN</p>
        <h1 class="admin-form-title">{{ "Edit" if variant else "Add" }} <em>variant.</em></h1>
        {% if error %}<p class="admin-error admin-error-light" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="admin-product-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="admin-form-grid">
                <label>Product<select name="product_id" required><option value="">Select product</option>{% for product in products %}<option value="{{ product.id }}"{% if variant and variant.product_id == product.id %} selected{% endif %}>{{ product.name }}</option>{% endfor %}</select></label>
                <label>SKU<input name="sku" maxlength="80" required value="{{ variant.sku if variant else '' }}"></label>
                <label>Size<input name="size" maxlength="30" required value="{{ variant.size if variant else '' }}"></label>
                <label>Colour<input name="color" maxlength="80" value="{{ variant.color if variant else '' }}"></label>
                <label>Price (INR, optional)<input name="price" type="number" min="0" step="0.01" value="{{ variant.price if variant and variant.price is not none else '' }}"></label>
                <label>Stock quantity<input name="stock_quantity" type="number" min="0" step="1" required value="{{ variant.stock_quantity if variant else 0 }}"></label>
                <label class="admin-checkbox-label"><input name="is_active" type="checkbox"{% if not variant or variant.is_active %} checked{% endif %}> Active variant</label>
            </div>
            <div class="admin-form-actions"><button class="button button-orange" type="submit">Save variant <i class="fa-solid fa-check" aria-hidden="true"></i></button><a class="button button-dark" href="{{ url_for('admin_inventory.listing') }}">Cancel</a></div>
        </form>
    </div>
</main>
{% endblock %}
