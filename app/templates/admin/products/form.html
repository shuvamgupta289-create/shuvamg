{% extends "base.html" %}

{% block title %}{{ "Edit" if product else "New" }} Product | STEPZONE Admin{% endblock %}

{% block content %}
<main class="admin-dashboard-page">
    <div class="container content-shell admin-form-shell">
        <a class="detail-breadcrumb" href="{{ url_for('admin_products.listing') }}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to products</a>
        <p class="eyebrow">STEPZONE / ADMIN</p>
        <h1 class="admin-form-title">{{ "Edit" if product else "New" }} <em>product.</em></h1>
        {% if error %}<p class="admin-error admin-error-light" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="admin-product-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="admin-form-grid">
                <label>Name<input name="name" maxlength="180" required value="{{ product.name if product else '' }}"></label>
                <label>Slug<input name="slug" maxlength="200" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required value="{{ product.slug if product else '' }}"></label>
                <label>Brand<select name="brand_id" required><option value="">Select brand</option>{% for brand in brands %}<option value="{{ brand.id }}"{% if product and product.brand_id == brand.id %} selected{% endif %}>{{ brand.name }}</option>{% endfor %}</select></label>
                <label>Category<select name="category_id" required><option value="">Select category</option>{% for category in categories %}<option value="{{ category.id }}"{% if product and product.category_id == category.id %} selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label>
                <label>Base price (INR)<input name="base_price" type="number" min="0.01" step="0.01" required value="{{ product.base_price if product else '' }}"></label>
                <label class="admin-checkbox-label"><input name="is_active" type="checkbox"{% if not product or product.is_active %} checked{% endif %}> Active product</label>
            </div>
            <label>Product image URL (HTTPS)<input name="image_url" type="url" maxlength="1000" value="{{ product.image_url if product and product.image_url else '' }}" placeholder="https://"></label>
            <label>Description<textarea name="description" rows="6">{{ product.description if product else '' }}</textarea></label>
            <div class="admin-form-actions"><button class="button button-orange" type="submit">Save product <i class="fa-solid fa-check" aria-hidden="true"></i></button><a class="button button-dark" href="{{ url_for('admin_products.listing') }}">Cancel</a></div>
        </form>
    </div>
</main>
{% endblock %}
