{% extends "base.html" %}

{% block title %}Admin Login | STEPZONE{% endblock %}

{% block content %}
<main class="admin-auth-page">
    <section class="admin-auth-panel" aria-labelledby="admin-login-title">
        <p class="eyebrow">STEPZONE / ADMIN</p>
        <h1 id="admin-login-title">Sign in to<br><em>the back office.</em></h1>
        {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="admin-auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Email address<input name="email" type="email" autocomplete="username" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="button button-orange" type="submit">Sign in <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </form>
    </section>
</main>
{% endblock %}
