{% extends "base.html" %}

{% block title %}Create Account | STEPZONE{% endblock %}

{% block content %}
<main class="admin-auth-page customer-auth-page"><section class="admin-auth-panel" aria-labelledby="register-title"><p class="eyebrow">STEPZONE / ACCOUNT</p><h1 id="register-title">Join the<br><em>rotation.</em></h1>{% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="admin-auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="full_name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Phone number<input name="phone" autocomplete="tel" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label><button class="button button-orange" type="submit">Create account <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('customer_auth.login') }}">Sign in</a></p></section></main>
{% endblock %}
