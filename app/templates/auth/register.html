{% extends "base.html" %}

{% block title %}Create Account | STEPZONE{% endblock %}

{% block content %}
<main class="admin-auth-page customer-auth-page">
    <section class="admin-auth-panel" aria-labelledby="register-title">
        <p class="eyebrow">STEPZONE / ACCOUNT</p>
        <h1 id="register-title">Join the<br><em>rotation.</em></h1>
        {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="admin-auth-form" data-password-form>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label>First name<input name="first_name" autocomplete="given-name" maxlength="80" required></label>
            <label>Last name<input name="last_name" autocomplete="family-name" maxlength="80" required></label>
            <label>Email address<input name="email" type="email" autocomplete="email" maxlength="255" required></label>
            <label>Mobile number (optional)<input name="phone" type="tel" autocomplete="tel" maxlength="30" pattern="[0-9+() -]{7,30}"></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
            <label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required data-password-confirm></label>
            <p class="form-message" data-password-message role="status" aria-live="polite"></p>
            <button class="button button-orange" type="submit">Create account <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('customer_auth.login', next=next_url) }}">Sign in</a></p>
    </section>
</main>
{% endblock %}
